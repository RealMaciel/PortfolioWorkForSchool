<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>

  <link rel="stylesheet" href="adivinha.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

    <a href="../principal/projetos/projetos.html">
    <button id="back">Voltar</button>
    </a>

  <div class="container">

    <h1>🎯 Adivinhe o Número</h1>

    <p class="sub">Tente descobrir o número entre 1 e 100</p>

    <input type="number" placeholder="Digite seu palpite" id="guess">

    <button id="btn">Tentar</button>

    <p id="message">Digite um número para começar</p>

    <p class="info">Tentativas: <span id="tries">0</span> Max: 10</p>

    <button id="reset">Reiniciar</button>

  </div>

  <script src="adivinha.js"></script>
</body>
</html>
